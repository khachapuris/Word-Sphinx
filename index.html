<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Puzzle book generator</title>
    <link rel="stylesheet" href="styles.css">

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/mdbassit/Coloris@latest/dist/coloris.min.css">
  </head>
  <body>
    <header>
      <h1>
        <span class="large-screens-only">WELCOME TO </span>
        THE FREE PUZZLE BOOK GENERATOR
        <span class="large-screens-only">!</span>
      </h1>
    </header>

    <aside>
      <div class="flex-wing">
        <div class="input-group">
          <label for="document-size">Choose document dimensions</label>
          <select name="document-size" id="document-size">
            <option value="11.69x8.27">A4 Landscape (11.69&Prime;&thinsp;&times;&thinsp;8.27&Prime;)</option>
            <option value="11x8.5">Letter Landscape (11&Prime;&thinsp;&times;&thinsp;8.5&Prime;)</option>
            <option value="8.27x11.69" selected>A4 Portrait (8.27&Prime;&thinsp;&times;&thinsp;11.69&Prime;)</option>
            <option value="8.5x11">Letter Portrait (8.5&Prime;&thinsp;&times;&thinsp;11&Prime;)</option>
            <option value="10x8">10&Prime;&thinsp;&times;&thinsp;8&Prime;</option>
            <option value="8x10">8&Prime;&thinsp;&times;&thinsp;10&Prime;</option>
            <option value="8.5x8.5">8.5&Prime;&thinsp;&times;&thinsp;8.5&Prime;</option>
            <option value="7x10">7&Prime;&thinsp;&times;&thinsp;10&Prime;</option>
            <option value="8x8">8&Prime;&thinsp;&times;&thinsp;8&Prime;</option>
            <option value="7.44x9.69">Crown Quarto (7.44&Prime;&thinsp;&times;&thinsp;9.69&Prime;)</option>
            <option value="6x9">Pocket (6&Prime;&thinsp;&times;&thinsp;9&Prime;)</option>
            <option value="5.5x8.5">Half-letter (5.5&Prime;&thinsp;&times;&thinsp;8.5&Prime;)</option>
          </select>
        </div>
        <div class="input-group">
          <label for="bg-color">Change the background color</label>
          <input
            name="bg-color"
            id="bg-color"
            type="text"
            value="#ffffff"
            data-coloris>
        </div>
        <div class="input-group">
          <label for="letter-color">Change the color of the letters</label>
          <input
            name="letter-color"
            id="letter-color"
            type="text"
            value="#808080"
            data-coloris>
        </div>
        <div class="input-group">
          <label>Edit the word list</label>
          <ul id="word-list"></ul>
          <button type="button" id="shuffle-words">Shuffle</button>
        </div>
      </div>
      <div class="flex-wing">
        <div class="input-group">
          <label>Download the document</label>
          <button type="button" id="download">as SVG</button>
        </div>
      </div>
    </aside>

    <main>
      <div id="current-page" class="current-page">
        <svg
          class="svg"
          width="420" height="594"
          xmlns="http://www.w3.org/2000/svg">
          <rect
            x="0" y="0" width="420" height="594"
            class="background-fill"></rect>
          <line
            x1="0" y1="50.8" x2="420" y2="50.8"
            class="margin-hl-line top"
            id="top-margin-hl-line"></line>
          <line
            stroke-dasharray="2, 2"
            x1="0" y1="50.8" x2="420" y2="50.8"
            stroke="#8888ff"
            shape-rendering="crispEdges"
            class="margin-line top"
            id="top-margin-line"></line>

          <line
            x1="38" y1="0" x2="38" y2="594"
            class="margin-hl-line left"></line>
          <line
            stroke-dasharray="2, 2"
            x1="38" y1="0" x2="38" y2="594"
            stroke="#8888ff"
            shape-rendering="crispEdges"
            class="margin-line left"></line>

          <line
            x1="382" y1="0" x2="382" y2="594"
            class="margin-hl-line right"></line>
          <line
            stroke-dasharray="2, 2"
            x1="382" y1="0" x2="382" y2="594"
            stroke="#8888ff"
            shape-rendering="crispEdges"
            class="margin-line right"></line>

          <line
            x1="0" y1="556" x2="420" y2="556"
            class="margin-hl-line bottom"></line>
          <line
            stroke-dasharray="2, 2"
            x1="0" y1="556" x2="420" y2="556"
            stroke="#8888ff"
            shape-rendering="crispEdges"
            class="margin-line bottom"></line>

          <g class="page-content"></g>
        </svg>
      </div>
    </main>

    <div id="ready-page" hidden>
      <svg
        class="svg"
        xmlns="http://www.w3.org/2000/svg">
        <rect class="background-fill"></rect>
        <g class="page-content"></g>
      </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/mdbassit/Coloris@latest/dist/coloris.min.js"></script>

    <script src="app.js"></script>
  </body>
</html>
